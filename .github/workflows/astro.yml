        // Universal Gemini caller that tries both ?key= and Bearer header, plus automatic model discovery
        async function callGeminiSmart(payloadObj) {
            const rawKey = document.getElementById('geminiApiKey').value.trim();
            if (!rawKey) throw new Error("No API key entered.");

            const candidateModels = [
                activeGeminiModel,
                "gemini-2.5-flash",
                "gemini-2.0-flash",
                "gemini-1.5-flash-latest",
                "gemini-1.5-pro-latest"
            ].filter((v, i, a) => a.indexOf(v) === i);

            let lastErrorMsg = "";

            for (const modelName of candidateModels) {
                // Attempt 1: Standard ?key= parameter
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(rawKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadObj)
                    });
                    const data = await res.json();
                    if (res.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        activeGeminiModel = modelName;
                        document.getElementById('apiStatusLabel').textContent = `Connected (${modelName})`;
                        document.getElementById('apiStatusLabel').style.color = 'var(--success)';
                        return data.candidates[0].content.parts[0].text;
                    }
                    lastErrorMsg = data.error?.message || `HTTP ${res.status}`;
                } catch (err) {
                    lastErrorMsg = err.message;
                }

                // Attempt 2: If key starts with AQ. or ya29., try OAuth Bearer header
                if (rawKey.startsWith("AQ.") || rawKey.startsWith("ya29.")) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${rawKey}`
                            },
                            body: JSON.stringify(payloadObj)
                        });
                        const data = await res.json();
                        if (res.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                            activeGeminiModel = modelName;
                            document.getElementById('apiStatusLabel').textContent = `Connected (${modelName})`;
                            document.getElementById('apiStatusLabel').style.color = 'var(--success)';
                            return data.candidates[0].content.parts[0].text;
                        }
                    } catch (e) {}
                }
            }

            throw new Error(lastErrorMsg);
        }

