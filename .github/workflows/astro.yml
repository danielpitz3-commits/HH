        function saveItemToLibrary(uid) {
            const item = currentProgram.find(i => i.uid === uid);
            if (!item) return;

            const existingIndex = exerciseLibrary.findIndex(e => e.id === item.id || e.name.toLowerCase() === item.name.toLowerCase());
            const cleanCopy = {
                id: item.id || Date.now(),
                name: item.name,
                category: item.category || "Deep Core & Lumbar",
                sets: item.sets,
                reps: item.reps,
                hold: item.hold,
                freq: item.freq,
                resistance: item.resistance,
                why: item.why,
                how: item.how
            };

            if (existingIndex >= 0) {
                exerciseLibrary[existingIndex] = cleanCopy;
            } else {
                exerciseLibrary.unshift(cleanCopy);
            }

            saveLibraryToLocal();
            filterLibrary();
            showToast(`💾 "${item.name}" saved to your permanent library!`);
