        // ==================== FUNCTIONAL OUTCOME CALCULATORS ====================
        function calcChairStand() {
            const age = document.getElementById('csAge').value;
            const sex = document.getElementById('csSex').value;
            const reps = parseInt(document.getElementById('csReps').value) || 0;
            const cutoffs = {
                "60-64": { M: 14, F: 12 }, "65-69": { M: 12, F: 11 }, "70-74": { M: 12, F: 10 },
                "75-79": { M: 11, F: 10 }, "80-84": { M: 10, F: 9 },  "85-89": { M: 8,  F: 8 }, "90-94": { M: 7, F: 4 }
            };
            const norm = cutoffs[age][sex];
            const isRisk = reps < norm;
            const box = document.getElementById('csResult');
            box.style.borderLeftColor = isRisk ? 'var(--danger)' : 'var(--success)';
            box.innerHTML = `
                <strong>CDC Normative Cutoff (${sex === 'M' ? 'Male' : 'Female'}, ${age} yrs):</strong> ≥ ${norm} reps<br>
                <strong>Status:</strong> <span style="color:${isRisk ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">
                ${isRisk ? '⚠️ Below Average — Increased Fall Risk' : '✅ At or Above Age Norm'}</span><br>
                <span style="font-size:0.76rem; color:var(--text-muted);">MCID (Hip/Knee OA & Older Adults): +2.0 to 2.6 reps</span>
            `;
        }

        function calcGaitSpeed() {
            const dist = parseFloat(document.getElementById('gsDist').value);
            const time = parseFloat(document.getElementById('gsTime').value) || 1;
            const mps = (dist / time).toFixed(2);
            const fps = (mps * 3.28084).toFixed(2);
            let cat = "", color = "var(--success)";
            if (mps < 0.4) { cat = "Household Ambulator (<0.4 m/s) — High Fall & Hospitalization Risk"; color = "var(--danger)"; }
            else if (mps < 0.8) { cat = "Limited Community Ambulator (0.4 – 0.8 m/s) — Intervention Indicated"; color = "var(--amber-border)"; }
            else if (mps < 1.0) { cat = "Community Ambulator (0.8 – 1.0 m/s) — Monitor Crosswalk Safety"; color = "var(--blue)"; }
            else { cat = "Full Community Ambulator (>1.0 m/s) — Normal / Lower Fall Risk"; color = "var(--success)"; }

            const box = document.getElementById('gsResult');
            box.style.borderLeftColor = color;
            box.innerHTML = `
                <strong>Speed:</strong> ${mps} m/s (${fps} ft/sec)<br>
                <strong>Classification:</strong> <span style="color:${color}; font-weight:700;">${cat}</span><br>
                <span style="font-size:0.76rem; color:var(--text-muted);">Crosswalk standard: ≥1.2 m/s | Meaningful Change (MCID): +0.10 m/s</span>
            `;
        }

        function calcTug5x() {
            const tug = parseFloat(document.getElementById('tugTime').value) || 0;
            const fts = parseFloat(document.getElementById('ftsTime').value) || 0;
            const tugRisk = tug >= 12.0;
            const ftsRisk = fts >= 15.0;
            document.getElementById('tugResult').innerHTML = `
                <strong>TUG (${tug}s):</strong> <span style="color:${tugRisk ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">
                ${tug >= 13.5 ? '⚠️ High Fall Risk (≥13.5s community / ≥12s CDC STEADI)' : (tugRisk ? '⚠️ Borderline Fall Risk (≥12.0s)' : '✅ Normal Mobility (<12s)')}</span><br>
                <strong>5x Sit-to-Stand (${fts}s):</strong> <span style="color:${ftsRisk ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">
                ${ftsRisk ? '⚠️ Recurrent Fall Risk (≥15.0s cutoff)' : '✅ Within Functional Threshold (<15.0s)'}</span>
            `;
        }

