        async function sendClinicalChat() {
            const inputEl = document.getElementById('clinicalChatInput');
            const question = inputEl.value.trim();
            if (!question) return;

            const historyEl = document.getElementById('clinicalChatHistory');
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble chat-user';
            userBubble.textContent = question;
            historyEl.appendChild(userBubble);
            inputEl.value = '';
            historyEl.scrollTop = historyEl.scrollHeight;

            const aiBubble = document.createElement('div');
            aiBubble.className = 'chat-bubble chat-ai';
            aiBubble.innerHTML = "<em>🩺 Analyzing clinical presentation...</em>";
            historyEl.appendChild(aiBubble);
            historyEl.scrollTop = historyEl.scrollHeight;

            clinicalChatMessages.push({ role: "user", parts: [{ text: question }] });

            try {
                const reply = await callGeminiSmart({
                    systemInstruction: { parts: [{ text: eliteClinicalSystemPersona }] },
                    contents: clinicalChatMessages
                });
                clinicalChatMessages.push({ role: "model", parts: [{ text: reply }] });
                aiBubble.textContent = reply;
                historyEl.scrollTop = historyEl.scrollHeight;
            } catch (e) {
                aiBubble.innerHTML = `<span style="color:var(--danger)"><strong>Google API Error:</strong> ${e.message}<br><em>If your AQ. token expired, paste a standard "AIza..." key below or click "📋 Copy Question w/ Persona".</em></span>`;
            }
        }

        function clearClinicalChat() {
            clinicalChatMessages = [];
            document.getElementById('clinicalChatHistory').innerHTML = `
                <div class="chat-bubble chat-ai"><strong>🩺 Chat Cleared.</strong> Ready for your next clinical case or differential question.</div>
            `;
        }

        function copyClinicalPromptToClipboard() {
            const q = document.getElementById('clinicalChatInput').value.trim() || "[Insert your clinical case or question here]";
            const fullText = `${eliteClinicalSystemPersona}\n\nClinician Question / Case:\n${q}`;
            navigator.clipboard.writeText(fullText);
            showToast("📋 Clinical question + OCS/FAAOMPT persona copied!");
        }

        initApp();
    </script>
</body>
</html>
